[package]
name = "easy-file"
version = "0.1.0"
description = "Modern, high-performance Linux File Manager"
authors = ["Easy File"]
edition = "2021"

[lib]
name = "easy_file_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
thiserror = "2"
notify = "8"
notify-debouncer-mini = "0.6"
trash = "5"
sysinfo = "0.33"
dirs = "6"
portable-pty = "0.9"
mime_guess = "2"
jwalk = "0.8"
urlencoding = "2"
